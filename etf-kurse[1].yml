name: ETF-Kurse aktualisieren

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedule runs in UTC; 15 min on weekdays.
    # Runs outside exchange hours are harmless; marketTime exposes quote age.
    - cron: '*/15 6-19 * * 1-5'

permissions:
  contents: write

concurrency:
  group: etf-kurse
  cancel-in-progress: false

jobs:
  update-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Echte ETF-Kurse abrufen
        run: python update_etfs.py
      - name: Kursdatei nur bei Änderung speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etf-kurse.json
          if git diff --cached --quiet; then
            echo "Keine Änderung"
          else
            git commit -m "ETF-Kurse aktualisieren"
            git push
          fi
